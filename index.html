<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MM-Fit Web</title>

  <!-- PyScript / Python in the browser -->
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <style>
    :root {
      --mm-green: #5DC8A2;
      --mm-blue: #5B88A5;
      --mm-grey: #708090;
      --mm-yellow: #D4AC0D;
      --border: #d8dee2;
      --background: #f4f6f7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0; background: var(--background);
      color: #333; font-family: Arial, Helvetica, sans-serif;
    }

    .header { background: white; padding: 18px 24px 14px; border-bottom: 1px solid var(--border); }
    .title { font-size: 27px; font-weight: 700; margin: 0; }
    .subtitle { color: #666; font-size: 13px; margin-top: 3px; }
    .version-badge { display: inline-block; margin-left: 8px; padding: 2px 7px; border-radius: 10px; background: #2F6FB0; color: white; font-size: 10px; font-weight: bold; vertical-align: 1px; }

    /* Layout en 3 colonnes */
    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 1.2fr) 180px minmax(500px, 3fr);
      gap: 12px; padding: 12px; max-width: 1600px; margin: auto;
    }

    .panel { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; }
    h3 { font-size: 15px; margin: 2px 0 8px; }

    .series-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .series-item { display: flex; align-items: center; gap: 7px; font-size: 14px; }

    button { width: 100%; border: none; border-radius: 5px; padding: 9px 7px; margin: 4px 0; color: white; font-weight: bold; cursor: pointer; font-size: 13px; }
    button:hover { filter: brightness(0.94); }
    .utility { background: var(--mm-blue); }
    .action { background: var(--mm-green); }
    .secondary { background: var(--mm-grey); }
    .warning { background: var(--mm-yellow); }

    .status { color: #555; font-size: 12px; line-height: 1.4; margin-top: 10px; }

    .table-wrap { max-height: 500px; overflow: auto; border: 1px solid var(--border); border-radius: 5px; margin-bottom: 15px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; background: white; }
    th { position: sticky; top: 0; background: #eef2f3; z-index: 1; padding: 6px; border-bottom: 1px solid #e3e6e8; }
    td { border-bottom: 1px solid #e3e6e8; padding: 4px 6px; text-align: right; }
    th:first-child, td:first-child { text-align: center; }
    td input { width: 100%; min-width: 65px; border: 1px solid transparent; background: transparent; padding: 3px; text-align: right; }
    td input:focus { border-color: var(--mm-blue); background: white; outline: none; }

    .plot { width: 100%; min-height: 550px; }
    .summary { background: #fafbfb; border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-top: 8px; font-size: 13px; line-height: 1.5; }
    .summary-title { font-weight: bold; margin-bottom: 5px; }
    
    .loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.92); z-index: 100; font-size: 16px; }
    .hidden { display: none !important; }

    /* CSS pour la fenêtre modale (Exclude Data) */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 200; }
    .modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 650px; max-height: 90vh; display: flex; flex-direction: column; }
    .ex-cb { transform: scale(1.2); cursor: pointer; }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 10px; }
      .controls h3 { grid-column: 1 / -1; }
    }
    /* --- ANIMATION ENZYME (LOADING) --- */
    .loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; 
      justify-content: center; background: rgba(255,255,255,0.95); z-index: 100;
    }
    .enzyme-container {
      position: relative; width: 60px; height: 60px; margin-bottom: 20px;
      animation: spin 2s linear infinite;
    }
    .enzyme {
      width: 0; height: 0;
      border-right: 30px solid transparent;
      border-top: 30px solid var(--mm-blue);
      border-left: 30px solid var(--mm-blue);
      border-bottom: 30px solid var(--mm-blue);
      border-radius: 50%;
    }
    .substrate {
      position: absolute; width: 14px; height: 14px;
      background: var(--mm-green); border-radius: 50%;
      top: 23px; right: -5px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* --- MODE IMPRESSION (PRINT / PDF) --- */
    @media print {
      body { background: white; font-size: 11px; }
      /* On cache tout ce qui ne doit pas être imprimé */
      .header, .controls, #loading, .status, .modal { display: none !important; }
      /* On redimensionne la mise en page pour remplir la feuille A4 */
      .layout { display: block; padding: 0; max-width: 100%; }
      .panel { border: none; padding: 0; margin-bottom: 20px; box-shadow: none; }
      /* On déroule le tableau pour voir toutes les lignes */
      .table-wrap { max-height: none; overflow: visible; border: none; }
      table { border-collapse: collapse; }
      th, td { border: 1px solid #ccc; padding: 4px; }
      .plot { break-inside: avoid; } /* Évite de couper le graph sur 2 pages */
    }
  </style>
</head>

<body>
<div id="loading" class="loading">
  <div class="enzyme-container">
    <div class="enzyme"></div>
    <div class="substrate"></div>
  </div>
  <div style="font-weight: bold; color: var(--mm-blue); font-size: 16px;">
    Loading Python scientific libraries...
  </div>
</div>

<!-- Modal Exclusion Dialog -->
<div id="exclusion-modal" class="modal hidden">
  <div class="modal-content">
    <h3>Exclude Data Points</h3>
    <div id="exclusion-grid-wrap" class="table-wrap"></div>
    <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px;">
      <button id="close-exclusion-btn" class="secondary" style="width: auto; padding: 8px 15px;">Cancel</button>
      <button id="apply-exclusion-btn" class="action" style="width: auto; padding: 8px 15px;">Apply and Re-Fit</button>
    </div>
  </div>
</div>

<div class="header">
  <div class="title">MM-Fit</div>
  <div class="subtitle">Michaelis-Menten enzyme kinetics analysis <span class="version-badge">v6.0</span></div>
</div>

<div class="layout">

  <!-- Gauche : Data Table -->
  <div class="panel data-panel">
    <h3>Data Table</h3>
    <div id="table-wrap" class="table-wrap"></div>
    <div class="status" style="text-align: center; color: #666;">
      <i>💡 Astuce : Faites <b>Ctrl+V</b> n'importe où sur la page pour importer vos données depuis Excel.</i>
    </div>
  </div>

  <!-- Milieu : Contrôles -->
  <div class="panel controls">
    <h3>Series</h3>
    <div id="series-list" class="series-list"></div>
    <h3>Actions</h3>
    <button id="paste-btn" class="utility">1- Paste from Excel</button>
    <button id="fit-btn" class="action">2- MM-Fit</button>
    <button id="lb-btn" class="action">3- LB plot</button>
    <button id="exclusion-btn" class="secondary">(4- Exclude data)</button>
    <button id="print-btn" class="utility">5- Print Report</button>
    <button id="howto-btn" class="action">How-To-Fit</button>
    <button id="reset-btn" class="warning" style="margin-top: 20px;">Reset</button>
    <div id="status" class="status">Ready.</div>
  </div>

  <!-- Droite : Graphique & Résumé -->
  <div class="panel fit-panel">
    <div id="mm-plot" class="plot"></div>
    <div id="summary" class="summary">
      <div class="summary-title">Fit values</div>
      Fit results will appear here.
    </div>
  </div>

</div>

<script type="py" config='{"packages":["numpy","scipy"]}'>
import numpy as np
from scipy.optimize import curve_fit
from scipy.stats import linregress
from pyscript import document, window
from pyodide.ffi import create_proxy
import asyncio
import json

# Data Model : Exclude est maintenant un dictionnaire par série
data = {
    "Exclude": {"v0": [False, False, False, False, False]},
    "[S]0": [0.0, 3.75e-4, 4.37e-4, 8.12e-4, 9.37e-4],
    "v0": [0.0, 4.32e-7, 4.86e-7, 5.08e-7, 5.45e-7],
}

MARKERS = ["circle", "diamond", "triangle-up", "square", "triangle-down", "star"]
COLORS = ["#1f77b4", "#ff7f0e", "#2ca02c", "#d62728", "#9467bd", "#8c564b"]

def michaelis_menten(s, vmax, km):
    return (vmax * s) / (km + s)

def js(id): return document.querySelector(id)
def set_status(message): js("#status").innerText = message
def fmt(x): return f"{x:.3e}"

def selected_series():
    return [el.value for el in document.querySelectorAll("#series-list input[type=checkbox]") if el.checked]

def render_series():
    box = js("#series-list")
    box.innerHTML = ""
    for series in data.keys():
        if series in ("Exclude", "[S]0"): continue
        label = document.createElement("label")
        label.className = "series-item"
        cb = document.createElement("input")
        cb.type = "checkbox"
        cb.value = series
        cb.checked = True
        label.appendChild(cb)
        text = document.createElement("span")
        text.innerText = series
        label.appendChild(text)
        box.appendChild(label)

def render_table():
    cols = list(data.keys())
    cols.remove("Exclude")
    rows = len(data["[S]0"])
    
    table = '<table><thead><tr>'
    table += "<th>#</th>"
    for c in cols: table += f"<th>{c}</th>"
    table += "</tr></thead><tbody>"

    for i in range(rows):
        table += f"<tr><td>{i+1}</td>"
        for c in cols:
            val = data[c][i]
            table += f'<td><input class="data-input" data-col="{c}" data-row="{i}" value="{fmt(val)}"></td>'
        table += "</tr>"

    table += "</tbody></table>"
    js("#table-wrap").innerHTML = table

    for inp in document.querySelectorAll(".data-input"):
        inp.onchange = lambda e: set_value(e.target.getAttribute("data-col"), int(e.target.getAttribute("data-row")), e.target.value)

def set_value(h, i, value):
    try: data[h][i] = float(str(value).replace(",", "."))
    except: pass

# --- IMPORT INVISIBLE (CTRL+V & BOUTON) ---
def process_pasted_text(text):
    if not text.strip():
        set_status("No data pasted.")
        return

    try:
        lines = [line.strip() for line in text.splitlines() if line.strip()]
        rows = [line.replace(",", ".").split() for line in lines]

        # Ignore Header
        try: float(rows[0][0])
        except: rows = rows[1:]

        if not rows: raise ValueError("No numerical data found.")
        matrix = [[float(x) for x in r] for r in rows]
        
        s_values = [r[0] for r in matrix]
        if 0.0 not in s_values:
            if not window.confirm("/!\\ Warning /!\\\n\nThe origin point (0,0) is missing\n\nDo you still want to proceed?"): return
        if s_values != sorted(s_values):
            if not window.confirm("/!\\ Warning /!\\\n\nData are not sorted from smallest to biggest\n\nDo you still want to proceed?"): return
        
        ncol = len(rows[0])
        data.clear()
        data["[S]0"] = [r[0] for r in matrix]
        data["Exclude"] = {}

        for j in range(1, ncol):
            series_name = f"v{j-1}"
            data[series_name] = [r[j] for r in matrix]
            data["Exclude"][series_name] = [False] * len(matrix)

        render_series()
        render_table()
        set_status(f"{len(matrix)} data points loaded.")
        
    except Exception as exc:
        set_status(f"Could not read data: {exc}")

async def paste_from_button(e):
    try:
        text = await window.navigator.clipboard.readText()
        process_pasted_text(text)
    except Exception:
        set_status("Clipboard access blocked. Please use Ctrl+V on your keyboard.")

def paste_from_keyboard(e):
    text = e.clipboardData.getData("text")
    if text:
        process_pasted_text(text)
        e.preventDefault()

# --- FENÊTRE MODALE EXCLUDE ---
def open_exclusion_gui(e):
    if not data.get("[S]0"): return
    
    v_cols = [c for c in data.keys() if c not in ("[S]0", "Exclude")]
    rows = len(data["[S]0"])
    
    html = "<table><thead><tr><th>#</th><th>[S]0</th>"
    for v in v_cols: html += f"<th colspan='2'>Series {v}</th>"
    html += "</tr></thead><tbody>"
    
    for i in range(rows):
        html += f"<tr><td><b>{i+1}</b></td><td>{fmt(data['[S]0'][i])}</td>"
        for v in v_cols:
            is_ex = "checked" if data["Exclude"].get(v, [False]*rows)[i] else ""
            html += f"<td style='text-align:center;'><input type='checkbox' class='ex-cb' data-series='{v}' data-row='{i}' {is_ex}></td>"
            html += f"<td>{fmt(data[v][i])}</td>"
        html += "</tr>"
    html += "</tbody></table>"
    
    js("#exclusion-grid-wrap").innerHTML = html
    js("#exclusion-modal").classList.remove("hidden")

def apply_exclusion(e):
    v_cols = [c for c in data.keys() if c not in ("[S]0", "Exclude")]
    rows = len(data["[S]0"])
    for v in v_cols: data["Exclude"][v] = [False] * rows
        
    cbs = document.querySelectorAll(".ex-cb")
    for cb in cbs:
        if cb.checked:
            v = cb.getAttribute("data-series")
            row = int(cb.getAttribute("data-row"))
            data["Exclude"][v][row] = True
            
    js("#exclusion-modal").classList.add("hidden")
    fit_data()

# --- MOTEUR DE FIT & PLOT ---
def fit_data():
    series_list = selected_series()
    if not series_list: return

    results = []
    for series in series_list:
        s = np.asarray(data["[S]0"], dtype=float)
        v = np.asarray(data[series], dtype=float)
        excluded = np.asarray(data["Exclude"].get(series, [False]*len(s)), dtype=bool)

        valid = np.isfinite(s) & np.isfinite(v) & (~excluded)
        excluded_valid = np.isfinite(s) & np.isfinite(v) & excluded
        s_fit, v_fit = s[valid], v[valid]
        s_excluded, v_excluded = s[excluded_valid], v[excluded_valid]

        if len(s_fit) < 3: continue

        try:
            p0 = [float(np.max(v_fit)), float(np.mean(s_fit[s_fit > 0])) if np.any(s_fit > 0) else 1.0]
            popt, pcov = curve_fit(michaelis_menten, s_fit, v_fit, p0=p0, maxfev=20000)
            vmax, km = popt
            perr = np.sqrt(np.maximum(np.diag(pcov), 0))
            residuals = v_fit - michaelis_menten(s_fit, vmax, km)
            ss_res = float(np.sum(residuals**2))
            ss_tot = float(np.sum((v_fit - np.mean(v_fit))**2))
            r2 = 1.0 - ss_res / ss_tot if ss_tot != 0 else 0.0

            results.append({
                "series": series, "s": s_fit, "v": v_fit, "vmax": vmax, "km": km,
                "vmax_se": perr[0], "km_se": perr[1], "r2": r2,
                "s_excluded": s_excluded, "v_excluded": v_excluded,
            })
        except: continue

    if not results: return

    traces = []
    nseries = len(results)

    for i, r in enumerate(results):
        color = COLORS[i % len(COLORS)]
        marker = MARKERS[i % len(MARKERS)]
        s, v = r["s"], r["v"]
        s_plot = np.linspace(0, float(np.max(data["[S]0"])) * 1.2, 250)
        fit = michaelis_menten(s_plot, r["vmax"], r["km"])

        hover_template = f"<b>{r['series']}</b><br>[S]₀: %{{x:.2e}}<br>v₀: %{{y:.2e}}<extra></extra>"

        traces.append({
            "x": s.tolist(), "y": v.tolist(), "type": "scatter", "mode": "markers",
            "name": f"Data {r['series']}", "marker": {"color": color, "symbol": marker, "size": 9},
            "hovertemplate": hover_template, "xaxis": "x", "yaxis": "y"
        })

        if len(r["s_excluded"]) > 0:
            traces.append({
                "x": r["s_excluded"].tolist(), "y": r["v_excluded"].tolist(), "type": "scatter",
                "mode": "markers", "name": f"Excluded {r['series']}",
                "hovertemplate": f"<b>Excluded {r['series']}</b><br>[S]₀: %{{x:.2e}}<br>v₀: %{{y:.2e}}<extra></extra>",
                "marker": {"color": color, "symbol": "x", "size": 11, "line": {"width": 2}},
                "xaxis": "x", "yaxis": "y", "showlegend": False
            })

        traces.append({
            "x": s_plot.tolist(), "y": fit.tolist(), "type": "scatter", "mode": "lines",
            "name": f"Fit {r['series']}", "line": {"color": color, "width": 2}, "hoverinfo": "skip", "xaxis": "x", "yaxis": "y"
        })

        residuals = v - michaelis_menten(s, r["vmax"], r["km"])
        tolerance = 0.10 * michaelis_menten(s_plot, r["vmax"], r["km"])
        row, xaxis_name, yaxis_name = i + 2, f"x{i + 2}", f"y{i + 2}"
        
        traces.append({
            "x": s.tolist(), "y": residuals.tolist(), "type": "scatter", "mode": "markers",
            "showlegend": False, "marker": {"color": color, "symbol": marker, "size": 7},
            "hovertemplate": f"Residual<br>[S]₀: %{{x:.2e}}<br>Res: %{{y:.2e}}<extra></extra>",
            "xaxis": xaxis_name, "yaxis": yaxis_name,
        })

        traces.append({
            "x": s_plot.tolist() + s_plot[::-1].tolist(),
            "y": tolerance.tolist() + (-tolerance[::-1]).tolist(),
            "type": "scatter", "fill": "toself", "fillcolor": color, "opacity": 0.13,
            "line": {"color": color, "width": 0}, "showlegend": False, "hoverinfo": "skip",
            "xaxis": xaxis_name, "yaxis": yaxis_name,
        })
        if len(r["s_excluded"]) > 0:
            res_ex = r["v_excluded"] - michaelis_menten(r["s_excluded"], r["vmax"], r["km"])
            traces.append({
                "x": r["s_excluded"].tolist(), "y": res_ex.tolist(), "type": "scatter", "mode": "markers",
                "showlegend": False, "marker": {"color": color, "symbol": "x", "size": 9, "line": {"width": 2}},
                "hovertemplate": f"<b>Excluded Residual</b><br>[S]₀: %{{x:.2e}}<br>Res: %{{y:.2e}}<extra></extra>",
                "xaxis": xaxis_name, "yaxis": yaxis_name,
            })

    main_height = 0.45
    gap = 0.015
    residual_height = (1.0 - main_height - gap * nseries) / nseries

    layout = {
        "title": {"text": "Michaelis-Menten Kinetics", "font": {"size": 18}},
        "height": max(500, 300 + 150 * nseries),
        "margin": {"l": 65, "r": 25, "t": 55, "b": 55},
        "legend": {"font": {"size": 11}},
        "hoverlabel": {"font": {"size": 13}, "namelength": -1},
        "xaxis": {"title": "[S]₀", "domain": [0, 1], "anchor": "y", "tickformat": ".1e"},
        "yaxis": {"title": "v₀", "domain": [1.0 - main_height, 1.0], "anchor": "x", "tickformat": ".1e"},
    }

    for i, r in enumerate(results):
        row = i + 2
        top = 1.0 - main_height - gap - i * (residual_height + gap)
        layout[f"xaxis{row}"] = {"title": "[S]₀" if i == nseries - 1 else "", "domain": [0, 1], "anchor": f"y{row}"}
        layout[f"yaxis{row}"] = {"title": f"Res", "domain": [top - residual_height, top], "anchor": f"x{row}"}

    window.Plotly.newPlot("mm-plot", window.JSON.parse(json.dumps(traces)), window.JSON.parse(json.dumps(layout)))

    summary = '<div class="summary-title">Fit values</div>'
    for r in results:
        summary += (f"<b>{r['series']}</b> — Vmax = <code>{r['vmax']:.3e}</code> &nbsp; Km = <code>{r['km']:.3e}</code> &nbsp; R² = <code>{r['r2']:.4f}</code><br>")
    js("#summary").innerHTML = summary


def lb_plot(e):
    series_list = selected_series()
    if not series_list: return

    results = []
    for series in series_list:
        s = np.asarray(data["[S]0"], dtype=float)
        v = np.asarray(data[series], dtype=float)
        excluded = np.asarray(data["Exclude"].get(series, [False]*len(s)), dtype=bool)

        valid = np.isfinite(s) & np.isfinite(v) & (~excluded) & (s > 0) & (v > 0)
        ex_valid = np.isfinite(s) & np.isfinite(v) & excluded & (s > 0) & (v > 0)
        
        x, y = 1.0 / s[valid], 1.0 / v[valid]
        x_ex, y_ex = 1.0 / s[ex_valid], 1.0 / v[ex_valid]

        if len(x) < 3: continue
        fit = linregress(x, y)
        if not np.isfinite(fit.slope) or fit.intercept == 0: continue

        vmax, km = 1.0 / fit.intercept, fit.slope / fit.intercept
        xmax = float(np.max(x))
        x_intercept = -fit.intercept / fit.slope
        xmin = min(x_intercept * 1.20, -0.10 * xmax)
        xx = np.linspace(xmin, xmax * 1.05, 200)

        results.append({
            "series": series, "x": x, "y": y, "xx": xx, "yy": fit.intercept + fit.slope * xx,
            "x_ex": x_ex, "y_ex": y_ex, "vmax": vmax, "km": km, "r2": float(fit.rvalue**2)
        })

    traces = []
    for i, r in enumerate(results):
        color = COLORS[i % len(COLORS)]
        marker = MARKERS[i % len(MARKERS)]
        hover_template = f"<b>{r['series']}</b><br>1/[S]₀: %{{x:.2e}}<br>1/v₀: %{{y:.2e}}<extra></extra>"
        
        traces.append({"x": r["x"].tolist(), "y": r["y"].tolist(), "type": "scatter", "mode": "markers", "name": f"Data {r['series']}", "hovertemplate": hover_template, "marker": {"color": color, "symbol": marker, "size": 9}})
        if len(r["x_ex"]) > 0:
            traces.append({"x": r["x_ex"].tolist(), "y": r["y_ex"].tolist(), "type": "scatter", "mode": "markers", "name": f"Excluded {r['series']}", "hovertemplate": f"<b>Excluded {r['series']}</b><br>1/[S]₀: %{{x:.2e}}<br>1/v₀: %{{y:.2e}}<extra></extra>", "marker": {"color": color, "symbol": "x", "size": 11, "line": {"width": 2}}, "showlegend": False})
        traces.append({"x": r["xx"].tolist(), "y": r["yy"].tolist(), "type": "scatter", "mode": "lines", "name": f"Fit {r['series']}", "hoverinfo": "skip", "line": {"color": color, "width": 2}})

    layout = {
        "title": {"text": "Lineweaver–Burk Plot", "font": {"size": 18}},
        "height": 560, "margin": {"l": 70, "r": 25, "t": 75, "b": 65},
        "hoverlabel": {"font": {"size": 13}, "namelength": -1},
        "xaxis": {"title": "1 / [S]₀", "zeroline": True, "tickformat": ".1e"},
        "yaxis": {"title": "1 / v₀", "zeroline": True, "tickformat": ".1e"},
    }
    window.Plotly.newPlot("mm-plot", window.JSON.parse(json.dumps(traces)), window.JSON.parse(json.dumps(layout)))

def reset(e):
    data.clear()
    data.update({
        "Exclude": {"v0": [False, False, False, False, False]},
        "[S]0": [0.0, 3.75e-4, 4.37e-4, 8.12e-4, 9.37e-4],
        "v0": [0.0, 4.32e-7, 4.86e-7, 5.08e-7, 5.45e-7],
    })
    render_series()
    render_table()
    window.Plotly.purge("mm-plot")

def how_to_fit_plot(e):
    """Simulation pédagogique : Minimisation globale et trajectoire des paramètres"""
    try:
        np.random.seed(42)
        s_data = np.linspace(0, 25, 15)
        vmax_true, km_true = 100.0, 5.0

        def mm_eq(s, vmax, km): return (vmax * s) / (km + s)
        v_data = mm_eq(s_data, vmax_true, km_true) + np.random.normal(0, 4, len(s_data))
        v_data = np.maximum(v_data, 0.5)

        popt, _ = curve_fit(mm_eq, s_data, v_data, p0=[120, 10])
        vmax_opt, km_opt = popt

        # Ciblage du point d'exemple pour les calculs détaillés
        target_idx = 7
        target_s = s_data[target_idx]
        target_v_exp = v_data[target_idx]

        # Génération de la trajectoire d'optimisation (120 frames)
        num_frames = 120
        vmax_start, km_start = 30.0, 15.0
        t = np.linspace(0, 5, num_frames - 10)
        approche = np.exp(-t)
        vmax_base = vmax_opt + (vmax_start - vmax_opt) * approche
        km_base = km_opt + (km_start - km_opt) * approche

        vmax_over = np.linspace(vmax_base[-1], vmax_opt + (vmax_opt * 0.08), 5)
        km_over = np.linspace(km_base[-1], km_opt + (km_opt * 0.15), 5)
        vmax_end = np.full(5, vmax_opt)
        km_end = np.full(5, km_opt)

        vmax_traj = np.concatenate([vmax_base, vmax_over, vmax_end])
        km_traj = np.concatenate([km_base, km_over, km_end])

        ssr_traj = np.array([np.sum((v_data - (v * s_data) / (k + s_data))**2) for v, k in zip(vmax_traj, km_traj)])
        s_plot = np.linspace(0, max(s_data) * 1.1, 100)

        # Calcul des limites pour fixer les échelles Y
        min_vmax, max_vmax = np.min(vmax_traj), np.max(vmax_traj)
        min_km, max_km = np.min(km_traj), np.max(km_traj)
        min_ssr, max_ssr = np.min(ssr_traj), np.max(ssr_traj)

        # Construction des frames d'animation Plotly
        frames = []
        steps_x = []

        for frame_idx in range(num_frames):
            vmax = vmax_traj[frame_idx]
            km = km_traj[frame_idx]
            v_model = (vmax * s_plot) / (km + s_plot)
            steps_x.append(frame_idx)

            # État de convergence pour le texte
            if frame_idx < num_frames - 10:
                status = "Descent in progress..."
                bg_color = "white"
                edge_color = "#ccc"
            elif frame_idx < num_frames - 5:
                status = "⚠️ SSR increased! Step rejected."
                bg_color = "#ffcccc"
                edge_color = "red"
            else:
                status = "✅ Convergence (Minimum reached)"
                bg_color = "#d4edda"
                edge_color = "green"

            ssr_val = ssr_traj[frame_idx]
            
            # Calculs pour le panneau de détails (target point)
            target_v_calc = (vmax * target_s) / (km + target_s)
            residu_brut = target_v_calc - target_v_exp
            carre_residu = residu_brut**2

            detail_text = (
                f"<b>Target point detail ([S]₀ = {target_s:.1f}):</b><br>"
                f"v_calc = ({vmax:.1f} × {target_s:.1f}) / ({km:.1f} + {target_s:.1f}) = {target_v_calc:.1f}<br>"
                f"v_exp = {target_v_exp:.1f}<br>"
                f"Error = {target_v_calc:.1f} - {target_v_exp:.1f} = {residu_brut:.2f}<br>"
                f"Error² = {carre_residu:.2f}"
            )

            frames.append({
                "name": str(frame_idx),
                "data": [
                    {"x": s_data.tolist(), "y": v_data.tolist()},
                    {"x": s_plot.tolist(), "y": v_model.tolist()},
                    {"x": [target_s, target_s], "y": [target_v_exp, target_v_calc]},
                    {"x": steps_x[:], "y": vmax_traj[:frame_idx+1].tolist()},
                    {"x": steps_x[:], "y": km_traj[:frame_idx+1].tolist()},
                    {"x": steps_x[:], "y": ssr_traj[:frame_idx+1].tolist()}
                ],
                "layout": {
                    "annotations": [
                        {
                            "text": f"<b>Step: {frame_idx}/{num_frames-1}</b><br>{status}<br>• Vmax = {vmax:.1f}<br>• Km = {km:.1f}<br>• SSR = {ssr_val:.1f}",
                            "xref": "paper", "yref": "paper", "x": 0.01, "y": 0.99, "xanchor": "left", "yanchor": "top",
                            "showarrow": False, "bgcolor": bg_color, "bordercolor": edge_color, "borderwidth": 1, "font": {"size": 11}
                        },
                        {
                            "text": detail_text,
                            "xref": "paper", "yref": "paper", 
                            "x": 0.58, "y": -0.15, "xanchor": "right", "yanchor": "top", # Déplacé dans l'espace blanc en bas
                            "showarrow": False, "bgcolor": "#ffcccc", "bordercolor": "red", "borderwidth": 1, "font": {"size": 11}
                        }
                    ]
                }
            })

        # Traces initiales (Frame 0)
        initial_v_model = (vmax_traj[0] * s_plot) / (km_traj[0] + s_plot)
        initial_v_calc = (vmax_traj[0] * target_s) / (km_traj[0] + target_s)
        
        traces = [
            {"x": s_data.tolist(), "y": v_data.tolist(), "mode": "markers", "name": "Experimental Data", "marker": {"color": "black", "size": 8}, "xaxis": "x", "yaxis": "y"},
            {"x": s_plot.tolist(), "y": initial_v_model.tolist(), "mode": "lines", "name": "Fitted Curve", "line": {"color": "#1f77b4", "width": 2}, "xaxis": "x", "yaxis": "y"},
            {"x": [target_s, target_s], "y": [target_v_exp, initial_v_calc], "mode": "lines", "name": "Residual", "line": {"color": "red", "dash": "dash", "width": 2}, "xaxis": "x", "yaxis": "y"},
            {"x": [0], "y": [vmax_traj[0]], "mode": "lines+markers", "name": "Vmax", "line": {"color": "green", "width": 2}, "xaxis": "x2", "yaxis": "y2", "showlegend": False},
            {"x": [0], "y": [km_traj[0]], "mode": "lines+markers", "name": "Km", "line": {"color": "magenta", "width": 2}, "xaxis": "x3", "yaxis": "y3", "showlegend": False},
            {"x": [0], "y": [ssr_traj[0]], "mode": "lines+markers", "name": "SSR", "line": {"color": "#ff7f0e", "width": 2}, "xaxis": "x4", "yaxis": "y4", "showlegend": False}
        ]

        layout = {
            "title": {"text": "How-To-Fit : Global Error Minimization Process", "font": {"size": 18}, "y": 0.98},
            "height": 650,
            "margin": {"l": 55, "r": 25, "t": 60, "b": 140}, # Marge inférieure augmentée pour l'encart rouge
            "grid": {"rows": 3, "columns": 2, "pattern": "independent"},
            "xaxis": {"domain": [0, 0.58], "anchor": "y", "title": "[S]₀"},
            "yaxis": {"domain": [0, 1], "anchor": "x", "title": "v₀"},
            
            # Affichage forcé des axes X (showline et showticklabels)
            "xaxis2": {"domain": [0.65, 1], "anchor": "y2", "showticklabels": True, "showline": True, "linecolor": "#ccc", "range": [0, num_frames]},
            "yaxis2": {"domain": [0.70, 1], "anchor": "x2", "title": "Vmax", "range": [min_vmax * 0.95, max_vmax * 1.05]},
            "xaxis3": {"domain": [0.65, 1], "anchor": "y3", "showticklabels": True, "showline": True, "linecolor": "#ccc", "range": [0, num_frames]},
            "yaxis3": {"domain": [0.35, 0.65], "anchor": "x3", "title": "Km", "range": [min_km * 0.95, max_km * 1.05]},
            "xaxis4": {"domain": [0.65, 1], "anchor": "y4", "title": "Algorithm Step", "showticklabels": True, "showline": True, "linecolor": "#ccc", "range": [0, num_frames]},
            "yaxis4": {"domain": [0, 0.30], "anchor": "x4", "title": "SSR Error", "range": [min_ssr * 0.9, max_ssr * 1.1]},
            
            "annotations": frames[0]["layout"]["annotations"],
            
            # Boutons Play/Pause alignés sous les petits graphiques
            "updatemenus": [{
                "type": "buttons", "direction": "right", "showactive": False,
                "x": 0.65, "y": -0.15, "xanchor": "left", "yanchor": "top",
                "buttons": [
                    {"label": "▶ Play", "method": "animate", "args": [None, {"frame": {"duration": 60, "redraw": True}, "fromcurrent": True, "transition": {"duration": 0}}]},
                    {"label": "⏸ Pause", "method": "animate", "args": [[None], {"frame": {"duration": 0, "redraw": False}, "mode": "immediate", "transition": {"duration": 0}}]}
                ]
            }],
            # Slider aligné avec les boutons
            "sliders": [{
                "active": 0, "yanchor": "top", "xanchor": "left", "currentvalue": {"prefix": "Step: ", "visible": True},
                "transition": {"duration": 0}, "pad": {"b": 10, "t": 40}, "len": 0.35, "x": 0.65, "y": -0.15,
                "steps": [{"args": [[str(k)], {"frame": {"duration": 0, "redraw": True}, "mode": "immediate"}], "label": str(k), "method": "animate"} for k in range(num_frames)]
            }]
        }

        config = {"responsive": True, "displaylogo": False}
        
        window.Plotly.newPlot("mm-plot", window.JSON.parse(json.dumps(traces)), window.JSON.parse(json.dumps(layout))).then(
            create_proxy(lambda res: window.Plotly.addFrames("mm-plot", window.JSON.parse(json.dumps(frames))))
        )
        set_status("How-To-Fit simulation loaded. Click Play.")

    except Exception as exc:
        set_status(f"Simulation error: {exc}")
