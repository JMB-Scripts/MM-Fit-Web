<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MM-Fit Web</title>

  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2026.7.1/core.js"></script>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      background: #f5f7f8;
      color: #333;
    }
    .header {
      background: white;
      padding: 22px 30px 18px;
      border-bottom: 1px solid #ddd;
    }
    .title {
      font-size: 28px;
      font-weight: 700;
      margin: 0;
    }
    .subtitle {
      color: #666;
      font-size: 14px;
      margin-top: 4px;
    }
    .status {
      margin: 30px auto;
      max-width: 700px;
      padding: 24px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .ok {
      color: #237a5b;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="title">MM-Fit</div>
    <div class="subtitle">Michaelis-Menten enzyme kinetics analysis</div>
  </div>

  <div class="status">
    <h2>PyScript test</h2>
    <p id="loading">Loading Python in your browser...</p>
    <p id="result"></p>
  </div>

  <script type="py">
from pyscript import document

document.querySelector("#loading").innerText = "Python is running in the browser."
document.querySelector("#result").innerHTML = (
    "<span class='ok'>✓ PyScript is working.</span><br><br>"
    "The MM-Fit calculations can now run directly in the student's browser."
)
  </script>
</body>
</html>
