<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MM-Fit Web</title>

  <!-- PyScript / Python in the browser -->
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2026.7.1/core.js"></script>

  <!-- Plotly for interactive browser graphics -->

  <style>
    :root {
      --mm-green: #5DC8A2;
      --mm-blue: #5B88A5;
      --mm-grey: #708090;
      --mm-yellow: #D4AC0D;
      --mm-red: #C0392B;
      --border: #d8dee2;
      --background: #f4f6f7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: #333;
      font-family: Arial, Helvetica, sans-serif;
    }

    .header {
      background: white;
      padding: 18px 24px 14px;
      border-bottom: 1px solid var(--border);
    }

    .title {
      font-size: 27px;
      font-weight: 700;
      margin: 0;
    }

    .subtitle {
      color: #666;
      font-size: 13px;
      margin-top: 3px;
    }

    .version-badge {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 7px;
      border-radius: 10px;
      background: #C0392B;
      color: white;
      font-size: 10px;
      font-weight: bold;
      vertical-align: 1px;
    }

    .layout {
      display: grid;
      grid-template-columns: 205px minmax(0, 1fr);
      gap: 12px;
      padding: 12px;
      max-width: 1500px;
      margin: auto;
    }

    .panel {
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .controls h3 {
      font-size: 15px;
      margin: 2px 0 8px;
    }

    .series-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .series-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 5px;
      padding: 9px 7px;
      margin: 4px 0;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }

    button:hover { filter: brightness(0.94); }
    button:disabled { opacity: 0.55; cursor: default; }

    .utility { background: var(--mm-blue); }
    .action { background: var(--mm-green); }
    .secondary { background: var(--mm-grey); }
    .warning { background: var(--mm-yellow); }

    textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 7px;
      font-family: monospace;
      font-size: 12px;
    }

    .status {
      color: #555;
      font-size: 12px;
      line-height: 1.4;
      margin-top: 10px;
    }

    .data-panel {
      overflow-x: auto;
    }

    .table-wrap {
      max-height: 300px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 5px;
      margin-bottom: 10px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
      background: white;
    }

    th {
      position: sticky;
      top: 0;
      background: #eef2f3;
      z-index: 1;
    }

    th, td {
      border-bottom: 1px solid #e3e6e8;
      padding: 4px 6px;
      text-align: right;
      white-space: nowrap;
    }

    th:first-child, td:first-child { text-align: center; }

    td input {
      width: 100%;
      min-width: 75px;
      border: 1px solid transparent;
      background: transparent;
      padding: 3px;
      text-align: right;
    }

    td input:focus {
      border-color: var(--mm-blue);
      background: white;
      outline: none;
    }

    .plot {
      width: 100%;
      min-height: 500px;
    }

    .summary {
      background: #fafbfb;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    .summary-title {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.92);
      z-index: 100;
      font-size: 16px;
    }

    .hidden { display: none; }

    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
      .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 10px; }
      .controls h3 { grid-column: 1 / -1; }
      textarea { min-height: 100px; }
    }
  
  .exclude-mode {
    outline: 2px solid #708090;
    outline-offset: 2px;
  }
  .excluded-row {
    opacity: 0.55;
    background: #f3f3f3 !important;
  }
  .exclude-cell input {
    transform: scale(1.15);
    cursor: pointer;
  }

</style>

<body>
<div id="loading" class="loading">Loading Python scientific libraries…</div>

<div class="header">
  <div class="title">MM-Fit</div>
  <div class="subtitle">
    Michaelis-Menten enzyme kinetics analysis
    <span class="version-badge">v8</span>
  </div>
</div>

<div class="layout">

  <div class="panel controls">
    <h3>Series</h3>
    <div id="series-list" class="series-list"></div>

    <h3>Data</h3>
    <textarea id="paste-input" placeholder="[S]0	v0	v1
0	0	0
3.75e-4	4.32e-7	...
4.37e-4	4.86e-7	..."></textarea>

    <button id="paste-btn" class="utility">1- Paste from Excel</button>
    <button id="fit-btn" class="action">2- MM-Fit</button>
    <button id="lb-btn" class="utility">3- LB plot</button>
    <button id="reset-btn" class="warning">Reset</button>

    <div id="status" class="status">Paste your Excel data to begin. Check a box to exclude a point.</div>
  </div>

  <div class="panel data-panel">

    <div id="mm-plot" class="plot"></div>

    <div id="summary" class="summary">
      <div class="summary-title">Fit values</div>
      Fit results will appear here.
    </div>
  </div>

</div>

<script type="py" config='{"packages":["numpy","scipy"]}'>
import numpy as np
from scipy.optimize import curve_fit
from scipy.stats import linregress
from pyscript import document, window
import json

# ------------------------------------------------------------------
# MM-Fit data model
# ------------------------------------------------------------------

data = {
    "Exclude": [False, False, False, False, False],
    "[S]0": [0.0, 3.75e-4, 4.37e-4, 8.12e-4, 9.37e-4],
    "v0": [0.0, 4.32e-7, 4.86e-7, 5.08e-7, 5.45e-7],
}

MARKERS = ["circle", "diamond", "triangle-up", "square", "triangle-down", "star"]
COLORS = ["#1f77b4", "#ff7f0e", "#2ca02c", "#d62728", "#9467bd", "#8c564b"]

def michaelis_menten(s, vmax, km):
    return (vmax * s) / (km + s)

def js(id):
    return document.querySelector(id)

def set_status(message):
    js("#status").innerText = message

def fmt(x):
    return f"{x:.3e}"

def selected_series():
    result = []
    for el in document.querySelectorAll("#series-list input[type=checkbox]"):
        if el.checked:
            result.append(el.value)
    return result

def render_series():
    box = js("#series-list")
    box.innerHTML = ""

    for series in data.keys():
        if series in ("Exclude", "[S]0"):
            continue

        label = document.createElement("label")
        label.className = "series-item"

        cb = document.createElement("input")
        cb.type = "checkbox"
        cb.value = series
        cb.checked = True
        label.appendChild(cb)

        text = document.createElement("span")
        text.innerText = series
        label.appendChild(text)

        box.appendChild(label)

def render_table():
    cols = list(data.keys())
    rows = len(data["[S]0"])

    table = '<table><thead><tr>'
    for c in cols:
        table += f"<th>{c}</th>"
    table += "</tr></thead><tbody>"

    for i in range(rows):
        table += "<tr>"

        checked = " checked" if bool(data["Exclude"][i]) else ""
        table += (
            '<td class="exclude-cell">'
            f'<input type="checkbox" class="exclude-point" '
            f'data-row="{i}"{checked}>'
            '</td>'
        )

        s = data["[S]0"][i]
        table += (
            f'<td><input class="data-input" data-col="[S]0" data-row="{i}" '
            f'value="{fmt(s)}"></td>'
        )

        for c in data.keys():
            if c in ("Exclude", "[S]0"):
                continue
            val = data[c][i]
            table += (
                f'<td><input class="data-input" data-col="{c}" data-row="{i}" '
                f'value="{fmt(val)}"></td>'
            )

        table += "</tr>"

    table += "</tbody></table>"
    js("#table-wrap").innerHTML = table

    # Every row has its own exclusion checkbox.
    for cb in document.querySelectorAll(".exclude-point"):
        cb.onchange = lambda e: set_exclude(
            int(e.target.getAttribute("data-row")),
            bool(e.target.checked)
        )

    # Editable data cells.
    for inp in document.querySelectorAll(".data-input"):
        inp.onchange = lambda e: set_value(
            e.target.getAttribute("data-col"),
            int(e.target.getAttribute("data-row")),
            e.target.value
        )


def set_exclude(i, value):
    data["Exclude"][i] = bool(value)

def set_value(i, h, value):
    try:
        data[h][i] = float(str(value).replace(",", "."))
    except:
        pass

def parse_paste():
    text = js("#paste-input").value.strip()

    if not text:
        set_status("No data pasted.")
        return

    try:
        lines = [line.strip() for line in text.splitlines() if line.strip()]
        rows = [line.replace(",", ".").split() for line in lines]

        # Remove header if first cell is not numeric
        try:
            float(rows[0][0])
        except:
            rows = rows[1:]

        if not rows:
            raise ValueError("No numerical data found.")

        ncol = len(rows[0])
        if ncol < 2:
            raise ValueError("At least [S]0 and one velocity series are required.")

        if any(len(r) != ncol for r in rows):
            raise ValueError("Rows do not all contain the same number of columns.")

        matrix = [[float(x) for x in r] for r in rows]

        data.clear()
        data["Exclude"] = [False] * len(matrix)
        data["[S]0"] = [r[0] for r in matrix]

        for j in range(1, ncol):
            data[f"v{j-1}"] = [r[j] for r in matrix]

        render_series()
        render_table()
        set_status(f"{len(matrix)} data points loaded — {ncol-1} series.")

    except Exception as exc:
        set_status(f"Could not read data: {exc}")

def fit_data():
    try:
        _fit_data()
    except Exception as exc:
        set_status(f"MM-Fit error: {type(exc).__name__}: {exc}")
        js("#summary").innerHTML = (
            '<div class="summary-title">Fit error</div>'
            f'<pre style="white-space:pre-wrap">{type(exc).__name__}: {exc}</pre>'
        )

def _fit_data():
    series_list = selected_series()

    if not series_list:
        set_status("Select at least one series.")
        return

    results = []
    n = len(data["[S]0"])

    for series in series_list:
        s = np.asarray(data["[S]0"], dtype=float)
        v = np.asarray(data[series], dtype=float)
        excluded = np.asarray(data["Exclude"], dtype=bool)

        valid = np.isfinite(s) & np.isfinite(v) & (~excluded)
        excluded_valid = np.isfinite(s) & np.isfinite(v) & excluded
        s_fit = s[valid]
        v_fit = v[valid]
        s_excluded = s[excluded_valid]
        v_excluded = v[excluded_valid]

        if len(s_fit) < 3:
            continue

        try:
            p0 = [
                float(np.max(v_fit)),
                float(np.mean(s_fit[s_fit > 0])) if np.any(s_fit > 0) else 1.0
            ]

            popt, pcov = curve_fit(
                michaelis_menten,
                s_fit,
                v_fit,
                p0=p0,
                maxfev=20000
            )

            vmax, km = popt
            perr = np.sqrt(np.maximum(np.diag(pcov), 0))
            vmax_se, km_se = perr

            residuals = v_fit - michaelis_menten(s_fit, vmax, km)
            ss_res = float(np.sum(residuals**2))
            ss_tot = float(np.sum((v_fit - np.mean(v_fit))**2))
            r2 = 1.0 - ss_res / ss_tot if ss_tot != 0 else 0.0

            results.append({
                "series": series,
                "s": s_fit,
                "v": v_fit,
                "vmax": vmax,
                "km": km,
                "vmax_se": vmax_se,
                "km_se": km_se,
                "r2": r2,
                "s_excluded": s_excluded,
                "v_excluded": v_excluded,
            })

        except Exception:
            continue

    if not results:
        set_status("No series could be fitted. Check the data and exclusions.")
        return

    # --------------------------------------------------------------
    # Plotly: main MM graph + one separate residual panel per series
    # --------------------------------------------------------------

    traces = []
    nseries = len(results)

    for i, r in enumerate(results):
        color = COLORS[i % len(COLORS)]
        marker = MARKERS[i % len(MARKERS)]

        s = r["s"]
        v = r["v"]
        smax = float(np.max(s))
        s_plot = np.linspace(0, smax * 1.2, 250)
        fit = michaelis_menten(s_plot, r["vmax"], r["km"])

        # Main MM plot
        traces.append({
            "x": s.tolist(),
            "y": v.tolist(),
            "type": "scatter",
            "mode": "markers",
            "name": f"Data {r['series']}",
            "marker": {"color": color, "symbol": marker, "size": 8},
            "xaxis": "x",
            "yaxis": "y",
        })

        # Explicitly show excluded points as crosses.
        if len(r["s_excluded"]) > 0:
            traces.append({
                "x": r["s_excluded"].tolist(),
                "y": r["v_excluded"].tolist(),
                "type": "scatter",
                "mode": "markers",
                "name": f"Excluded {r['series']}",
                "marker": {
                    "color": color,
                    "symbol": "x",
                    "size": 11,
                    "line": {"width": 2}
                },
                "xaxis": "x",
                "yaxis": "y",
            })

        traces.append({
            "x": s_plot.tolist(),
            "y": fit.tolist(),
            "type": "scatter",
            "mode": "lines",
            "name": (
                f"Fit {r['series']} (R²={r['r2']:.3f})"
                f"<br>Vmax={r['vmax']:.2e} ± {r['vmax_se']:.1e}"
                f"<br>Km={r['km']:.2e} ± {r['km_se']:.1e}"
            ),
            "line": {"color": color, "width": 2},
            "xaxis": "x",
            "yaxis": "y",
        })

        # One independent residual panel for THIS series
        residuals = v - michaelis_menten(s, r["vmax"], r["km"])
        tolerance = 0.10 * michaelis_menten(s_plot, r["vmax"], r["km"])

        row = i + 2
        xaxis_name = f"x{row}"
        yaxis_name = f"y{row}"

        traces.append({
            "x": s.tolist(),
            "y": residuals.tolist(),
            "type": "scatter",
            "mode": "markers",
            "name": f"Residuals {r['series']}",
            "showlegend": False,
            "marker": {"color": color, "symbol": marker, "size": 7},
            "xaxis": xaxis_name,
            "yaxis": yaxis_name,
        })

        traces.append({
            "x": s_plot.tolist() + s_plot[::-1].tolist(),
            "y": tolerance.tolist() + (-tolerance[::-1]).tolist(),
            "type": "scatter",
            "fill": "toself",
            "fillcolor": color,
            "opacity": 0.13,
            "line": {"color": color, "width": 0},
            "name": "±10% tolerance",
            "showlegend": False,
            "xaxis": xaxis_name,
            "yaxis": yaxis_name,
        })

        traces.append({
            "x": s_plot.tolist(),
            "y": np.zeros_like(s_plot).tolist(),
            "type": "scatter",
            "mode": "lines",
            "line": {"color": "#444", "width": 1},
            "showlegend": False,
            "xaxis": xaxis_name,
            "yaxis": yaxis_name,
        })

    # Layout: main plot + one residual panel per series
    main_height = 0.40
    gap = 0.015
    residual_height = (1.0 - main_height - gap * nseries) / nseries

    layout = {
        "title": {"text": "Michaelis-Menten Kinetics", "font": {"size": 18}},
        "height": 500 + 170 * nseries,
        "margin": {"l": 65, "r": 25, "t": 55, "b": 55},
        "legend": {"font": {"size": 11}},
        "xaxis": {
            "title": "[S]₀",
            "domain": [0, 1],
            "anchor": "y",
            "tickformat": ".1e"
        },
        "yaxis": {
            "title": "v₀",
            "domain": [1.0 - main_height, 1.0],
            "anchor": "x",
            "tickformat": ".1e"
        },
    }

    # Add separate domains for residual panels.
    for i, r in enumerate(results):
        row = i + 2
        top = 1.0 - main_height - gap - i * (residual_height + gap)
        bottom = top - residual_height

        layout[f"xaxis{row}"] = {
            "title": "[S]₀" if i == nseries - 1 else "",
            "domain": [0, 1],
            "anchor": f"y{row}"
        }
        layout[f"yaxis{row}"] = {
            "title": f"Residuals {r['series']}",
            "domain": [bottom, top],
            "anchor": f"x{row}"
        }

    # JSON is a robust Python -> JavaScript bridge in Pyodide.
    config = {
        "responsive": True,
        "displaylogo": False
    }

    js_traces = window.JSON.parse(json.dumps(traces))
    js_layout = window.JSON.parse(json.dumps(layout))
    js_config = window.JSON.parse(json.dumps(config))

    window.Plotly.newPlot(
        "mm-plot",
        js_traces,
        js_layout,
        js_config
    )

    # Summary
    summary = '<div class="summary-title">Fit values</div>'

    for r in results:
        vmax_rse = abs(r["vmax_se"] / r["vmax"]) * 100 if r["vmax"] != 0 else float("inf")
        km_rse = abs(r["km_se"] / r["km"]) * 100 if r["km"] != 0 else float("inf")

        summary += (
            f"<b>{r['series']}</b> — "
            f"Vmax = <code>{r['vmax']:.3e}</code> ± <code>{r['vmax_se']:.2e}</code> "
            f"({vmax_rse:.0f}%) &nbsp; "
            f"Km = <code>{r['km']:.3e}</code> ± <code>{r['km_se']:.2e}</code> "
            f"({km_rse:.0f}%) &nbsp; "
            f"R² = <code>{r['r2']:.4f}</code><br>"
        )

    js("#summary").innerHTML = summary
    set_status(f"{len(results)} series fitted.")


def lb_plot():
    try:
        series_list = selected_series()
        if not series_list:
            set_status("Select at least one series.")
            return

        results = []
        for series in series_list:
            s = np.asarray(data["[S]0"], dtype=float)
            v = np.asarray(data[series], dtype=float)
            excluded = np.asarray(data["Exclude"], dtype=bool)

            valid = np.isfinite(s) & np.isfinite(v) & (~excluded) & (s > 0) & (v > 0)
            x = 1.0 / s[valid]
            y = 1.0 / v[valid]

            if len(x) < 3:
                continue

            fit = linregress(x, y)
            slope = float(fit.slope)
            intercept = float(fit.intercept)

            if not np.isfinite(slope) or not np.isfinite(intercept) or intercept == 0:
                continue

            vmax = 1.0 / intercept
            km = slope / intercept

            slope_se = float(fit.stderr) if fit.stderr is not None else float("nan")
            intercept_se = float(fit.intercept_stderr) if fit.intercept_stderr is not None else float("nan")
            vmax_se = abs(intercept_se / intercept**2)

            if slope != 0 and np.isfinite(slope_se) and np.isfinite(intercept_se):
                km_se = abs(km) * np.sqrt(
                    (slope_se / slope)**2 + (intercept_se / intercept)**2
                )
            else:
                km_se = float("nan")

            # Extend the regression line into the negative 1/[S] region
            # so that the x-intercept (-1/Km) is visible.
            x_intercept = -intercept / slope if slope != 0 else 0.0
            xmax = float(np.max(x))
            xmin_data = float(np.min(x))
            xmin = min(x_intercept * 1.20, -0.10 * xmax, -0.05 * max(xmax, xmin_data))
            if xmin >= 0:
                xmin = -0.10 * xmax

            xx = np.linspace(xmin, xmax * 1.05, 200)
            yy = intercept + slope * xx

            results.append({
                "series": series, "x": x, "y": y,
                "xx": xx, "yy": yy,
                "x_intercept": x_intercept,
                "vmax": vmax, "vmax_se": vmax_se,
                "km": km, "km_se": km_se,
                "r2": float(fit.rvalue**2)
            })

        if not results:
            set_status("No valid series for LB plot. Need ≥3 positive points.")
            return

        traces=[]
        for i,r in enumerate(results):
            color=COLORS[i % len(COLORS)]
            marker=MARKERS[i % len(MARKERS)]
            traces.append({
                "x":r["x"].tolist(),"y":r["y"].tolist(),
                "type":"scatter","mode":"markers",
                "name":f"Data {r['series']}",
                "marker":{"color":color,"symbol":marker,"size":8}
            })
            traces.append({
                "x":r["xx"].tolist(),"y":r["yy"].tolist(),
                "type":"scatter","mode":"lines",
                "name":f"Fit {r['series']}",
                "line":{"color":color,"width":2}
            })

        annotations=[]
        for i,r in enumerate(results):
            annotations.append({
                "xref":"paper","yref":"paper",
                "x":0.01,"y":0.99-i*0.075,
                "xanchor":"left","yanchor":"top",
                "text":(
                    f"<b>{r['series']}</b> — "
                    f"Vmax={r['vmax']:.3e} ± {r['vmax_se']:.2e} &nbsp; "
                    f"Km={r['km']:.3e} ± {r['km_se']:.2e} &nbsp; "
                    f"R²={r['r2']:.4f}"
                ),
                "showarrow":False,"font":{"size":12}
            })

        layout={
            "title":{"text":"Lineweaver–Burk Plot","font":{"size":18}},
            "height":560,
            "margin":{"l":70,"r":25,"t":75,"b":65},
            "xaxis":{
                "title":"1 / [S]₀",
                "zeroline":True,
                "tickformat":".1e",
                "rangemode":"normal"
            },
            "yaxis":{
                "title":"1 / v₀",
                "zeroline":True,
                "tickformat":".1e",
                "rangemode":"normal"
            },
            "annotations":annotations,
            "legend":{"font":{"size":11}}
        }
        config={"responsive":True,"displaylogo":False}

        window.Plotly.newPlot(
            "mm-plot",
            window.JSON.parse(json.dumps(traces)),
            window.JSON.parse(json.dumps(layout)),
            window.JSON.parse(json.dumps(config))
        )
        set_status(f"{len(results)} series plotted in Lineweaver–Burk form.")

    except Exception as exc:
        set_status(f"LB error: {type(exc).__name__}: {exc}")


def reset():
    data.clear()
    data.update({
        "Exclude": [False, False, False, False, False],
        "[S]0": [0.0, 3.75e-4, 4.37e-4, 8.12e-4, 9.37e-4],
        "v0": [0.0, 4.32e-7, 4.86e-7, 5.08e-7, 5.45e-7],
    })

    js("#paste-input").value = ""
    render_series()
    render_table()
    js("#summary").innerHTML = (
        '<div class="summary-title">Fit values</div>'
        'Fit results will appear here.'
    )
    window.Plotly.purge("mm-plot")
    set_status("Paste your Excel data to begin. Check a box to exclude a point.")

# ------------------------------------------------------------------
# Events
# ------------------------------------------------------------------

js("#paste-btn").onclick = lambda e: parse_paste()
js("#fit-btn").onclick = lambda e: fit_data()
js("#lb-btn").onclick = lambda e: lb_plot()
js("#reset-btn").onclick = lambda e: reset()

render_series()
render_table()
js("#loading").classList.add("hidden")
</script>
